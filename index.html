<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mes Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button class="btn-nav" id="btn-back" style="display: none;" onclick="goBack()">Retour</button>
        <span id="app-title">Mes Flashcards</span>
        <button class="btn-nav" id="btn-stats" onclick="document.getElementById('import-file').click()">Importer</button>
        <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
    </header>

    <main>
        <!-- VUE ACCUEIL (Dossiers et Export) -->
        <div id="view-home" class="view active">
            <div class="actions-row">
                <button class="btn-primary" onclick="createFolder()">+ Nouveau Dossier</button>
                <button class="btn-secondary" onclick="exportData()">Exporter (Sauvegarde)</button>
            </div>
            <button class="btn-primary" style="background-color: var(--text-main);" onclick="startReview('global')">Révision Globale (Tous les dossiers)</button>
            
            <h3 class="section-title">Mes Dossiers</h3>
            <div id="folders-list" class="list-container">
                <!-- Les dossiers s'afficheront ici -->
            </div>
        </div>

        <!-- VUE DOSSIER (Contenu d'un dossier) -->
        <div id="view-folder" class="view">
            <h2 id="current-folder-title" class="section-title">Titre du dossier</h2>
            <div class="actions-row">
                <button class="btn-primary" onclick="showCreateView()">+ Ajouter Flashcard</button>
                <button class="btn-primary" style="background-color: var(--success);" onclick="startReview('folder')">Réviser ce dossier</button>
            </div>
            <div id="cards-list" class="list-container">
                <!-- Les cartes du dossier s'afficheront ici -->
            </div>
        </div>

        <!-- VUE CRÉATION MANUELLE (Recto/Verso avec image) -->
        <div id="view-create" class="view">
            <div class="input-group">
                <label>Image Recto (Optionnel - Schémas, photos...)</label>
                <input type="file" id="card-image-input" accept="image/*">
            </div>
            <div class="input-group">
                <textarea id="card-q-input" dir="auto" rows="3" placeholder="Question ou mot à traduire..."></textarea>
            </div>
            <div class="input-group">
                <textarea id="card-a-input" dir="auto" rows="3" placeholder="Réponse / Verso"></textarea>
            </div>
            <button class="btn-primary" onclick="saveCard()">Sauvegarder la carte</button>
        </div>

        <!-- VUE RÉVISION (Boucle infinie et Swipe) -->
        <div id="view-review" class="view">
            <div class="stats-live" id="review-progress">Cartes vues : 0</div>
            
            <div class="card-container" id="card-container">
                <div class="flashcard" id="flashcard">
                    <!-- Face Recto -->
                    <div class="card-face card-front">
                        <img id="view-q-img" class="card-image" style="display:none;">
                        <div id="view-q-text" class="card-text">Question</div>
                    </div>
                    <!-- Face Verso -->
                    <div class="card-face card-back">
                        <div id="view-q-reminder" class="q-reminder">Rappel question</div>
                        <div id="view-a-text" class="a-reveal" dir="auto">Réponse</div>
                    </div>
                </div>
            </div>

            <div class="controls" id="review-controls">
                <button class="btn-action btn-wrong" onclick="handleAnswer(false)">✗</button>
                <button class="btn-action btn-right" onclick="handleAnswer(true)">✓</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
