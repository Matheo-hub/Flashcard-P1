<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VUE ACCUEIL (Dossiers) -->
    <div id="view-home" class="view active">
        <div class="header-top">
            <h1>Mes Dossiers</h1>
            <button class="btn-header" onclick="document.getElementById('import-file').click()">Importer</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importData(event)">
        </div>
        <button class="btn btn-card" onclick="createFolder()">+ Nouveau Dossier</button>
        <button class="btn btn-accent" onclick="startReview('global')">Révision Globale</button>
        
        <div id="folders-list"></div>
    </div>

    <!-- VUE CONTENU DU DOSSIER -->
    <div id="view-folder" class="view">
        <div class="header-top">
            <h1 id="current-folder-title">Dossier</h1>
            <button class="btn-header" onclick="switchView('view-home')">Retour</button>
        </div>
        <button class="btn btn-card" onclick="showCreateView('manual')">+ Créer une Flashcard (Manuel)</button>
        <button class="btn btn-card" onclick="showCreateView('express')">⚡ Import Rapide en Masse</button>
        <button class="btn btn-accent" style="background: var(--success);" onclick="startReview('folder')">Réviser ce dossier</button>
        
        <div id="cards-list"></div>
    </div>

    <!-- VUE CRÉATION MANUELLE -->
    <div id="view-create-manual" class="view">
        <div class="header-top">
            <h1>Création Manuelle</h1>
            <button class="btn-header" onclick="openFolder(currentFolderId)">Annuler</button>
        </div>
        <div class="input-group">
            <label>Image Recto (Optionnel - Schéma, etc.)</label>
            <input type="file" id="card-image-input" accept="image/*">
        </div>
        <div class="input-group">
            <label>Recto (Question / Mot)</label>
            <textarea id="card-q-input" dir="auto" rows="3" placeholder="Ex: Cœur / בoker..."></textarea>
        </div>
        <div class="input-group">
            <label>Verso (Réponse)</label>
            <textarea id="card-a-input" dir="auto" rows="3" placeholder="Ex: Organe musculaire..."></textarea>
        </div>
        <button class="btn btn-accent" onclick="saveManualCard()">Enregistrer la carte</button>
    </div>

    <!-- VUE CRÉATION / IMPORT RAPIDE -->
    <div id="view-create-express" class="view">
        <div class="header-top">
            <h1>Import Rapide</h1>
            <button class="btn-header" onclick="openFolder(currentFolderId)">Annuler</button>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">
            Colle ta liste au format <strong>Recto | Verso</strong> (une carte par ligne).<br>
            Exemple : <br><em>Bonjour | Shalom</em>
        </p>
        <div class="input-group">
            <textarea id="express-textarea" rows="10" placeholder="Recto 1 | Verso 1&#10;Recto 2 | Verso 2"></textarea>
        </div>
        <button class="btn btn-accent" onclick="saveExpressCards()">Ajouter les cartes</button>
    </div>

    <!-- VUE RÉVISION (Plein écran) -->
    <div id="view-review" class="view-fullscreen">
        <div class="review-header">
            <button class="btn-close" onclick="openFolder(currentFolderId)">Fermer ✕</button>
            <div class="review-stats" id="review-progress">Vues : 0</div>
        </div>
        
        <div class="card-container" id="card-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <img id="view-q-img" class="card-image" style="display:none;">
                    <div id="view-q-text" class="card-text">Question</div>
                </div>
                <div class="card-face card-back">
                    <div id="view-q-reminder" class="q-reminder"></div>
                    <div id="view-a-text" class="a-reveal" dir="auto">Réponse</div>
                </div>
            </div>
        </div>

        <div class="controls" id="review-controls">
            <button class="btn-action btn-wrong" onclick="handleAnswer(false)">✗</button>
            <button class="btn-action btn-right" onclick="handleAnswer(true)">✓</button>
        </div>
    </div>

    <!-- TAB BAR -->
    <nav class="tab-bar">
        <div class="tab-item active" onclick="switchView('view-home')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Dossiers
        </div>
        <div class="tab-item" onclick="exportData()">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Sauvegarde
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
